<script id="gate-crypto">
function b64ToBytes(s) {
  var bin = atob(s);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function payloadAad(p) {
  return "v" + p.v + "|" + p.kdf + "|" + p.iter + "|" + p.cipher;
}
async function decryptPayload(p, passphrase) {
  if (!p || p.v !== 1 || p.kdf !== "PBKDF2-SHA256" || p.cipher !== "AES-256-GCM" ||
      typeof p.iter !== "number" || p.iter < 600000 || p.iter > 10000000 ||
      typeof p.salt !== "string" || typeof p.iv !== "string" || typeof p.ct !== "string") {
    throw new Error("Unsupported payload");
  }
  var enc = new TextEncoder();
  var baseKey = await crypto.subtle.importKey("raw", enc.encode(String(passphrase).normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: b64ToBytes(p.salt), iterations: p.iter },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
  var plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(p.iv), additionalData: enc.encode(payloadAad(p)), tagLength: 128 },
    key,
    b64ToBytes(p.ct)
  );
  return new TextDecoder("utf-8", { fatal: true }).decode(plain);
}
</script>

<script>
(function () {
  "use strict";
  var form = document.getElementById("unlock");
  var input = document.getElementById("passphrase");
  var button = document.getElementById("submit");
  var msg = document.getElementById("msg");
  var payload = null;

  try { payload = JSON.parse(document.getElementById("payload").textContent); } catch (e) { payload = null; }
  if (!payload) {
    msg.textContent = "No protected content was found.";
    button.disabled = true;
    return;
  }
  if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
    msg.textContent = "This browser cannot open this page. Use a current browser over HTTPS.";
    button.disabled = true;
    return;
  }
  input.focus();

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pass = input.value;
    if (!pass) {
      msg.textContent = "Enter the password.";
      input.focus();
      return;
    }
    button.disabled = true;
    button.textContent = "Unlocking…";
    msg.textContent = "";
    decryptPayload(payload, pass).then(function (html) {
      pass = null;
      input.value = "";
      document.open();
      document.write(html);
      document.close();
    }, function () {
      pass = null;
      input.value = "";
      input.setAttribute("aria-invalid", "true");
      button.disabled = false;
      button.textContent = "Unlock";
      msg.textContent = "That password did not work.";
      input.focus();
    });
  });
})();
</script>
